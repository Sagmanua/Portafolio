<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Details | Bohdan Sydorenko</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="details-page">
    <div class="bg-grid" aria-hidden="true"></div>
    <header class="topbar">
        <a href="index.html" class="logo">Bohdan Sydorenko</a>
        <div class="nav-right">
            <label class="lang-box">
                <span class="sr-only">Language</span>
                <select id="lang-selector" aria-label="Language">
                    <option value="es">ES</option>
                    <option value="en">EN</option>
                    <option value="ua">UA</option>
                </select>
            </label>
            <a href="index.html" class="nav-btn">← Back</a>
        </div>
    </header>

    <main class="container">
        <article id="details-container" class="details-card">
            <h1 id="det-title" class="title"></h1>
            <div id="det-media" class="media-container"></div>
            <div id="det-languages" class="project-langs" style="margin-top: 24px;"></div>
            <div id="det-long-description" class="desc"></div>
            <div class="card-actions" id="det-links" style="margin-top: 28px;"></div>
        </article>
    </main>

    <script src="details.js"></script>
</body>
</html>
